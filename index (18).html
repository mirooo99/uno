<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNO Rooms</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--r:#ed1c24;--y:#ffde16;--g:#50aa44;--b:#0956bf;--bg1:#238a58;--bg2:#0b3d2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#176843;--bg2:#06241a}}
:root[data-theme="dark"]{--bg1:#176843;--bg2:#06241a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 35%,var(--bg1),var(--bg2));color:#fff;font:16px system-ui,sans-serif;overflow-x:hidden}
.f,.card{font-family:'Lilita One','Arial Black',Impact,sans-serif}
.card{position:relative;flex:none;width:78px;height:117px;border-radius:10px;background:var(--c);border:4px solid #fff;box-shadow:0 3px 8px #0009;color:#fff;overflow:hidden;user-select:none;transition:transform .15s,filter .2s}
.ov{position:absolute;inset:12% -8%;background:#fff;border-radius:50%;transform:rotate(-28deg);display:grid;place-items:center;box-shadow:inset 0 0 6px #0003}
.mid{transform:rotate(28deg);font-size:46px;font-style:italic;color:var(--c);text-shadow:2px 2px 0 #0003}
.tl,.br{position:absolute;font-size:17px;font-style:italic;text-shadow:1px 1px 0 #0007}.tl{top:3px;left:6px}.br{bottom:3px;right:6px;transform:rotate(180deg)}
.wild{background:#111}.wild .ov{background:conic-gradient(var(--r) 0 25%,var(--y) 0 50%,var(--g) 0 75%,var(--b) 0)}
.wild .mid{color:#fff;-webkit-text-stroke:3px #111;paint-order:stroke fill;font-size:40px}
.back{--c:#111}.back .ov{background:var(--r)}.back .mid{color:var(--y);font-size:26px;text-shadow:2px 2px 0 #000}
.big{width:104px;height:156px}.big .mid{font-size:62px}.big .tl,.big .br{font-size:22px}
.ok{cursor:pointer;box-shadow:0 0 14px 2px #fff,0 3px 8px #0009}.ok:hover{transform:translateY(-18px)}.no{filter:brightness(.55)}
.drop{animation:drop .4s cubic-bezier(.2,1.4,.4,1)}@keyframes drop{from{transform:translateY(-120px) rotate(40deg) scale(1.3);opacity:0}}
.logo{display:inline-block;background:var(--r);border:7px solid #fff;border-radius:50%;padding:6px 44px 14px;transform:rotate(-8deg);font:italic 72px 'Lilita One',Impact,sans-serif;color:var(--y);text-shadow:5px 5px 0 #000;box-shadow:0 8px 24px #0008}
#home{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;position:relative}
.panel{position:relative;z-index:1;background:#0007;backdrop-filter:blur(6px);border-radius:20px;padding:22px;width:min(380px,92vw);margin-top:24px;display:grid;gap:12px}
input{font:inherit;padding:12px;border-radius:12px;border:0;text-align:center;font-weight:700;width:100%;text-transform:none}
#cd{text-transform:uppercase;letter-spacing:6px}
button{font:700 16px 'Lilita One',system-ui;letter-spacing:.5px;padding:12px 20px;border:0;border-radius:14px;cursor:pointer;background:var(--y);color:#111;box-shadow:0 4px 0 #0006}
button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.5}
.r{background:var(--r);color:#fff}.g{background:var(--g);color:#fff}
.fl{position:absolute;opacity:.35;animation:fl 14s linear infinite;pointer-events:none}@keyframes fl{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-30vh) rotate(360deg)}}
#err{color:#ffb3b3;min-height:1.2em;margin:0}
#room{min-height:100vh;display:flex;flex-direction:column}
#bar{display:flex;gap:8px;padding:10px;overflow-x:auto;align-items:center}
.pl{flex:none;background:#0006;border-radius:14px;padding:8px 14px;display:grid;text-align:center;border:3px solid transparent}
.pl.cur{border-color:var(--y);box-shadow:0 0 16px var(--y);animation:pu 1.2s infinite alternate}@keyframes pu{to{transform:scale(1.06)}}
.pl small{opacity:.8}
#code{font:32px 'Lilita One';letter-spacing:6px;background:#0006;border-radius:12px;padding:4px 14px;cursor:pointer;margin-left:auto}
#tbl{flex:1;display:grid;place-items:center;align-content:center;gap:14px;padding:10px;text-align:center}
#piles{display:flex;gap:30px;align-items:center}
.disc{border-radius:14px;box-shadow:0 0 0 7px var(--cc),0 0 36px 8px var(--cc)}
#msg{font:22px 'Lilita One';min-height:1.4em;text-shadow:0 2px 4px #0008}#log{opacity:.8;min-height:1.3em}
#hand{display:flex;padding:26px 16px 14px;overflow-x:auto;min-height:170px}
#hand .card+.card{margin-left:-30px}#hand .card:hover{z-index:5}
#acts{display:flex;gap:10px;justify-content:center;padding:0 10px 10px;min-height:56px}
#pick{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:9}
#pick div{display:grid;grid-template-columns:1fr 1fr;gap:14px}#pick button{width:120px;height:120px;border-radius:50%;color:#fff;font-size:20px}
</style></head><body>
<div id="home"><div style="position:relative;z-index:1"><div class="logo">UNO</div>
<div class="panel"><input id="nm" maxlength="14" placeholder="Your name"><button id="mk" class="r" disabled>Create room</button>
<div style="opacity:.7">or join friends</div><input id="cd" maxlength="4" placeholder="CODE"><button id="jn" class="g" disabled>Join room</button><p id="err"></p></div></div></div>
<div id="room" hidden><div id="bar"></div><div id="tbl"><div id="piles"></div><div id="msg"></div><div id="log"></div><div id="ctl"></div></div><div id="acts"></div><div id="hand"></div></div>
<div id="pick" hidden><div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const C={r:'#ed1c24',y:'#ffde16',g:'#50aa44',b:'#0956bf',k:'#111'},N={r:'Red',y:'Yellow',g:'Green',b:'Blue',k:'Wild'},sym={S:'⊘',R:'⇄',D:'+2',F:'+4',W:''};
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const cl=o=>JSON.parse(JSON.stringify(o)),face=c=>c[1] in sym?sym[c[1]]:c[1],nm=c=>(N[c[0]]+' '+face(c)).trim();
const mkDeck=()=>{const d=[];for(const c of 'rygb'){d.push(c+'0');for(let i=1;i<10;i++)d.push(c+i,c+i);for(const v of 'SRD')d.push(c+v,c+v)}for(let i=0;i<4;i++)d.push('kW','kF');return d};
const shuf=a=>{for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const card=(c,x='')=>{const f=c[1]=='W'?'':face(c);return `<div class="card ${c[0]=='k'?'wild':''} ${x}" data-c="${c}" style="--c:${C[c[0]]}"><span class=tl>${f}</span><div class=ov><span class=mid>${f}</span></div><span class=br>${f}</span></div>`};
const back=x=>`<div class="card back ${x||''}"><div class=ov><span class=mid>UNO</span></div></div>`;
const DB='PASTE_YOUR_FIREBASE_DATABASE_URL_HERE';let me=ls('uid'),S,code,pend=null,lastN=0;if(!me){me=Math.random().toString(36).slice(2,10);ls('uid',me)}
const err=m=>$('#err').textContent=m||'';
const nx=(s,k=1)=>((s.cur+s.dir*k)%s.players.length+s.players.length)%s.players.length;
const ok=(s,c,h)=>{const t=s.discard[s.discard.length-1];if(c[0]=='k')return c[1]!='F'||!h.some(x=>x[0]==s.color);return c[0]==s.color||c[1]==t[1]};
const take=(s,p,n)=>{while(n--){if(!s.deck.length&&s.discard.length>1){const t=s.discard.pop();s.deck=shuf(s.discard);s.discard=[t]}if(s.deck.length)s.players[p].hand.push(s.deck.pop())}};
const norm=s=>{if(!s)return s;s.deck=s.deck||[];s.discard=s.discard||[];s.players=(s.players||[]).map(p=>({...p,hand:p.hand||[]}));return s};
const url=()=>DB.replace(/\/$/,'')+'/rooms/'+code+'.json',put=s=>fetch(url(),{method:'PUT',body:JSON.stringify(s)}).catch(e=>err('Offline: '+e.message));
const upd=f=>{const s=cl(S);f(s);S=s;render();put(s)};
function start(){upd(s=>{s.deck=shuf(mkDeck());s.players.forEach(p=>{p.hand=s.deck.splice(-7);p.said=false});let i=s.deck.length;while(!/\d/.test(s.deck[--i][1]));s.discard=s.deck.splice(i,1);s.color=s.discard[0][0];s.cur=Math.random()*s.players.length|0;s.dir=1;s.drawn=null;s.uno=null;s.winner=null;s.status='play';s.log='Game on!'})}
function play(i,col){upd(s=>{const p=s.players[s.cur],c=p.hand.splice(i,1)[0],v=c[1];s.discard.push(c);s.color=c[0]=='k'?col:c[0];s.drawn=null;
if(p.hand.length!=1)p.said=false;s.uno=p.hand.length==1&&!p.said?s.cur:null;
let k=1;if(v=='R'){if(s.players.length==2)k=2;else s.dir*=-1}if(v=='S')k=2;if(v=='D'||v=='F'){take(s,nx(s),v=='D'?2:4);k=2}
s.log=p.name+' played '+nm(c)+(c[0]=='k'?' → '+N[col]:'');
if(!p.hand.length){s.status='done';s.winner=s.cur;let t=0;s.players.forEach(q=>q.hand.forEach(x=>t+=/\d/.test(x[1])?+x[1]:x[0]=='k'?50:20));p.score+=t;s.pts=t;s.uno=null}else s.cur=nx(s,k)})}
const draw=()=>upd(s=>{const p=s.players[s.cur];take(s,s.cur,1);s.uno=null;const c=p.hand[p.hand.length-1];if(ok(s,c,p.hand)){s.drawn=p.hand.length-1;s.log=p.name+' drew a playable card'}else{s.log=p.name+' drew a card';s.cur=nx(s)}});
const pass=()=>upd(s=>{s.drawn=null;s.cur=nx(s)});
const uno=()=>upd(s=>{const m=s.players.findIndex(p=>p.id==me);s.players[m].said=true;if(s.uno==m)s.uno=null});
const catchU=()=>upd(s=>{const q=s.players[s.uno];take(s,s.uno,2);s.log=q.name+' forgot to say UNO! +2 cards';s.uno=null});
function render(){
if(!S)return;const lobby=S.status=='lobby',m=S.players.findIndex(p=>p.id==me),mine=S.cur==m&&S.status=='play',h=m>=0?S.players[m].hand:[];
$('#home').hidden=true;$('#room').hidden=false;
$('#bar').innerHTML=S.players.map((p,i)=>`<div class="pl ${S.status=='play'&&i==S.cur?'cur':''}"><b>${esc(p.name)}${p.id==S.host?' 👑':''}</b><small>${lobby?'ready':p.hand.length+' cards'} · ${p.score} pts</small></div>`).join('')+`<div id="code" title="Click to copy">${code}</div>`;
$('#code').onclick=()=>{try{navigator.clipboard.writeText(code)}catch(e){}};
const host=S.host==me;
if(lobby){$('#piles').innerHTML=back('big');$('#msg').textContent='Room '+code+' — share the code!';$('#log').textContent=S.players.length+' player(s) · need 2–10';$('#ctl').innerHTML=host?`<button class=g id=go ${S.players.length<2?'disabled':''}>Start game</button>`:'Waiting for the host…'}
else{const top=S.discard[S.discard.length-1],d=S.discard.length!=lastN;lastN=S.discard.length;
$('#piles').innerHTML=`<div id=dk class="${mine&&S.drawn==null?'ok':''}" style="${mine&&S.drawn==null?'cursor:pointer':''}">${back('big')}</div><div style="--cc:${C[S.color]}" class="disc ${d?'drop':''}">${card(top,'big')}</div><div class=f style="font-size:34px">${S.dir>0?'↻':'↺'}</div>`;
$('#log').textContent=S.log||'';
if(S.status=='done'){$('#msg').textContent='🏆 '+S.players[S.winner].name+' wins +'+S.pts+' pts!';$('#ctl').innerHTML=host?'<button class=g id=go>Next round</button>':'Waiting for the host…'}
else{$('#msg').textContent=mine?(S.drawn!=null?'Play the card you drew, or pass':'Your turn!'):S.players[S.cur].name+"'s turn";$('#ctl').innerHTML=''}}
$('#hand').innerHTML=h.map((c,i)=>{const p=mine&&(S.drawn==null||S.drawn==i)&&ok(S,c,h);return card(c,p?'ok':(mine?'no':'')).replace('<div','<div data-i="'+i+'"')}).join('');
$('#acts').innerHTML=(S.status=='play'&&m>=0&&h.length<=2?'<button class=r id=un>UNO!</button>':'')+(S.uno!=null&&S.uno!=m&&m>=0?'<button class=r id=ct>Catch!</button>':'')+(mine&&S.drawn!=null?'<button id=ps>Pass</button>':'');
const g=(i,f)=>{const e=$(i);if(e)e.onclick=f};g('#go',start);g('#dk',()=>{if(mine&&S.drawn==null)draw()});g('#un',uno);g('#ct',catchU);g('#ps',pass);
}
$('#hand').onclick=e=>{const el=e.target.closest('.card.ok');if(!el)return;const i=+el.dataset.i;if(S.players[S.cur].hand[i][0]=='k'){pend=i;$('#pick').hidden=false}else play(i)};
$('#pick div').innerHTML='rygb'.split('').map(c=>`<button data-k=${c} style="background:${C[c]}">${N[c]}</button>`).join('');
$('#pick').onclick=e=>{const k=e.target.dataset.k;$('#pick').hidden=true;if(k&&pend!=null)play(pend,k);pend=null};
async function enter(c,make){const name=$('#nm').value.trim().slice(0,14)||'Player';ls('uname',name);code=c.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4)return err('Enter a 4-letter code');
if(DB.includes('PASTE'))return err('Database URL is not set in the file yet');ls('room',code);let s;
try{s=norm(await(await fetch(url())).json())}catch(e){return err('Cannot reach the database')}
if(!s){if(!make)return err('Room not found');s={host:me,status:'lobby',players:[],deck:[],discard:[],cur:0,dir:1,color:'r',drawn:null,uno:null,winner:null,log:''}}
const has=x=>x.players.some(p=>p.id==me);
if(!has(s)){if(s.status!='lobby')return err('Game already started');if(s.players.length>=10)return err('Room is full');
for(let t=0;t<5&&!has(s);t++){s.players.push({id:me,name,hand:[],score:0,said:false});await put(s);await new Promise(r=>setTimeout(r,400+Math.random()*600));try{s=norm(await(await fetch(url())).json())||s}catch(e){}}}
const es=new EventSource(url());es.addEventListener('put',e=>{const d=JSON.parse(e.data);if(d.path=='/'&&d.data){S=norm(d.data);render()}})}
$('#mk').onclick=()=>enter(Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join(''),true);
$('#jn').onclick=()=>enter($('#cd').value,false);
$('#nm').value=ls('uname')||'';$('#cd').value=ls('room')||'';
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='fl';d.style.cssText=`left:${i*11}%;animation-delay:${-i*1.6}s;animation-duration:${12+i%4*3}s`;d.innerHTML=Math.random()<.8?card('rygb'[i%4]+(i%10)):card('kF');$('#home').appendChild(d)}
$('#mk').disabled=$('#jn').disabled=false;
</script></body></html>
