<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNO Rooms</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
@property --cc{syntax:'<color>';inherits:true;initial-value:#ffffff}
:root{--r:#ed1c24;--y:#ffde16;--g:#50aa44;--b:#0956bf}
*{box-sizing:border-box}[hidden]{display:none!important}
body{--bg1:#238a58;--bg2:#0b3d2a;--acc:#ffde16;--cb:#ed1c24;--pat:repeating-linear-gradient(45deg,#ffffff07 0 2px,transparent 2px 6px);margin:0;min-height:100vh;color:#fff;font:16px system-ui,sans-serif;overflow-x:hidden;touch-action:manipulation;background:radial-gradient(circle at 50% 35%,var(--bg1),var(--bg2)) fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);transition:--cc .7s}
body::before,body::after{content:'';position:fixed;inset:0;pointer-events:none}
body::before{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--cc) 42%,transparent),transparent 62%);opacity:0;transition:opacity .6s}body.rm::before{opacity:1}
body::after{background:var(--pat)}
body[data-t=midnight]{--bg1:#35208a;--bg2:#07041a;--acc:#b388ff;--cb:#7c4dff;--pat:radial-gradient(#ffffff26 1px,transparent 1.5px) 0 0/22px 22px}
body[data-t=sunset]{--bg1:#ff8a5c;--bg2:#4a1342;--acc:#ffe27a;--cb:#ff3d71;--pat:linear-gradient(#ffffff0c 50%,transparent 0) 0 0/100% 6px}
body[data-t=ocean]{--bg1:#1bb1c9;--bg2:#04243d;--acc:#7ef9ff;--cb:#1e88e5;--pat:repeating-radial-gradient(circle at 50% 120%,#ffffff0e 0 18px,transparent 18px 40px)}
body[data-t=neon]{--bg1:#1b1035;--bg2:#000;--acc:#39ff14;--cb:#ff2bd6;--pat:linear-gradient(#ff2bd626 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#00e5ff26 1px,transparent 1px) 0 0/40px 40px}
.f,.card,button,#code,#msg,.logo,.av{font-family:'Lilita One','Arial Black',Impact,sans-serif}
.card{position:relative;flex:none;width:80px;height:120px;border-radius:12px;background:radial-gradient(circle at 25% 15%,#fff4,transparent 50%),var(--c);border:4px solid #fff;box-shadow:0 5px 12px #000a;color:#fff;overflow:hidden;user-select:none;transition:transform .2s,filter .25s,box-shadow .25s}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,#fff7 50%,transparent 62%);transform:translateX(-130%);transition:transform .7s;pointer-events:none}
.ok:hover::after{transform:translateX(130%)}.drop .card::after{animation:sh .9s .35s}@keyframes sh{to{transform:translateX(130%)}}
.ov{position:absolute;inset:11% -9%;background:linear-gradient(#fff,#ececec);border-radius:50%;transform:rotate(-28deg);display:grid;place-items:center;box-shadow:inset 0 0 8px #0004,0 0 0 2px #0002}
.mid{transform:rotate(28deg);font-size:48px;font-style:italic;color:var(--c);text-shadow:3px 3px 0 #0005;display:grid;place-items:center;font-weight:400}
.tl,.br{position:absolute;font-size:17px;font-style:italic;text-shadow:1px 2px 0 #0008}.tl{top:3px;left:6px}.br{bottom:3px;right:6px;transform:rotate(180deg)}
.wild{background:#111}.wild .ov{background:conic-gradient(var(--r) 0 25%,var(--y) 0 50%,var(--g) 0 75%,var(--b) 0)}.wild .mid{color:#fff;font-size:40px}
.back{--c:#14141c}.back .ov{background:radial-gradient(circle at 40% 30%,#fff4,transparent 55%),var(--cb)}.back .mid{color:var(--y);font-size:28px;text-shadow:2px 2px 0 #000}
.big{width:104px;height:156px;border-radius:14px}.big .mid{font-size:62px}.big .tl,.big .br{font-size:22px}
.sk{display:block;width:.8em;height:.8em;border:.14em solid var(--c);border-radius:50%;position:relative;overflow:hidden}.sk::after{content:'';position:absolute;left:50%;top:-.2em;bottom:-.2em;width:.14em;margin-left:-.07em;background:var(--c);transform:rotate(45deg)}
.d2,.d4{position:relative;display:block;width:.9em;height:.9em}.d2 i,.d4 i{position:absolute;top:.1em;width:.5em;height:.72em;border-radius:.08em;background:var(--c);box-shadow:0 0 0 .04em #fff,0 0 0 .06em #0003}
.d2 i:first-child{left:.08em;transform:rotate(-14deg);filter:brightness(.8)}.d2 i:last-child{left:.32em;transform:rotate(12deg)}
.d4 i{width:.36em;height:.58em}.d4 i:nth-child(1){left:-.04em;transform:rotate(-24deg)}.d4 i:nth-child(2){left:.14em;transform:rotate(-8deg)}.d4 i:nth-child(3){left:.32em;transform:rotate(8deg)}.d4 i:nth-child(4){left:.5em;transform:rotate(24deg)}
.ok{cursor:pointer;box-shadow:0 0 0 3px var(--acc),0 0 18px var(--acc),0 5px 12px #000a}.ok:hover{transform:translateY(-8px) scale(1.06)}.no{filter:brightness(.5) saturate(.7)}
.in{animation:deal .55s cubic-bezier(.2,1.3,.4,1) var(--dl,0ms) backwards}@keyframes deal{from{translate:0 -260px;rotate:-30deg;scale:.4;opacity:0}}
.drop{animation:drop .5s cubic-bezier(.2,1.3,.4,1)}@keyframes drop{from{translate:0 -170px;rotate:35deg;scale:1.5;opacity:0}}
.shake{animation:shake .3s}@keyframes shake{25%{translate:-7px 0}75%{translate:7px 0}}
.pop{display:inline-block;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.4);opacity:0}}
#home,#room{position:relative;z-index:1;animation:fin .6s}@keyframes fin{from{opacity:0;transform:scale(.96)}}
.logo{display:inline-block;background:var(--cb);border:7px solid #fff;border-radius:50%;padding:6px 44px 14px;transform:rotate(-8deg);font:italic 72px 'Lilita One',Impact,sans-serif;color:var(--y);text-shadow:5px 5px 0 #000;box-shadow:0 8px 24px #0008;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:rotate(-8deg) translateY(-9px)}}
#home{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}
.panel{position:relative;z-index:1;background:#0008;backdrop-filter:blur(8px);border:1px solid #fff2;border-radius:22px;padding:22px;width:min(380px,92vw);margin-top:24px;display:grid;gap:12px}
input{font:inherit;padding:12px;border-radius:12px;border:0;text-align:center;font-weight:700;width:100%}
#cd{text-transform:uppercase;letter-spacing:6px}
button{font:700 16px 'Lilita One',system-ui;letter-spacing:.5px;padding:12px 20px;border:0;border-radius:14px;cursor:pointer;background:var(--y);color:#111;box-shadow:0 4px 0 #0006;transition:transform .1s,filter .2s}button:hover{filter:brightness(1.1)}
button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.5}
.r{background:var(--r);color:#fff}.g{background:var(--g);color:#fff}
.fl{position:absolute;opacity:.35;animation:fl 14s linear infinite;pointer-events:none}@keyframes fl{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-30vh) rotate(360deg)}}
#err{color:#ffb3b3;min-height:1.2em;margin:0}
.fx{display:flex;gap:7px;align-items:center;margin-left:auto}.panel .fx{justify-content:center;margin:0}
.sw{width:22px;height:22px;border-radius:50%;border:3px solid #fff8;cursor:pointer;transition:transform .2s}.sw.on{border-color:#fff;transform:scale(1.28)}#snd{cursor:pointer;font-size:20px;padding:0 4px}
#room{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#bar{display:flex;gap:8px;padding:10px;overflow-x:auto;align-items:center}
.pl{flex:none;display:flex;align-items:center;background:#0007;border-radius:16px;padding:7px 14px 7px 8px;border:3px solid transparent;transition:border-color .3s,box-shadow .3s}
.pl.cur{border-color:var(--acc);box-shadow:0 0 18px var(--acc);animation:pu 1.2s infinite alternate}@keyframes pu{to{transform:scale(1.06)}}
.pl small{opacity:.8}.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-right:9px;border:2px solid #fff;font-size:17px}
#code{font:30px 'Lilita One';letter-spacing:6px;background:#0007;border-radius:12px;padding:4px 14px;cursor:pointer}
#tbl{flex:1;display:grid;place-items:center;align-content:center;gap:14px;padding:10px;text-align:center}
#piles{display:flex;gap:26px;align-items:center}
.disc{border-radius:16px;box-shadow:0 0 0 7px var(--cc),0 0 40px 10px var(--cc)}
.dir{font-size:38px;animation:spin 5s linear infinite}.dir.ccw{animation-direction:reverse}@keyframes spin{to{transform:rotate(360deg)}}
#msg{font:24px 'Lilita One';min-height:1.4em;text-shadow:0 2px 6px #000a}#log{opacity:.85;min-height:1.3em}
#hand{display:flex;justify-content:safe center;padding:36px 18px 18px;overflow-x:auto;min-height:190px}
#hand .card{transform-origin:50% 140%;transform:rotate(calc((var(--i) - var(--m))*2.6deg))}#hand .card+.card{margin-left:-34px}
#hand .card.ok:hover{transform:translateY(-28px) scale(1.12);z-index:6;box-shadow:0 0 0 3px var(--acc),0 0 24px var(--acc),0 12px 20px #000a}
#acts{display:flex;gap:10px;justify-content:center;padding:0 10px 10px;min-height:56px}#acts button{animation:pop .35s}
#pick{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:9;animation:fin .25s}
#pick div{display:grid;grid-template-columns:1fr 1fr;gap:14px}#pick button{width:120px;height:120px;border-radius:50%;color:#fff;font-size:20px;animation:pop .4s backwards}#pick button:nth-child(2){animation-delay:.07s}#pick button:nth-child(3){animation-delay:.14s}#pick button:nth-child(4){animation-delay:.21s}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:20;pointer-events:none;animation:cf 3.2s ease-in forwards}@keyframes cf{to{transform:translate(var(--x),110vh) rotate(var(--rr))}}
.disc{position:relative;width:104px;height:156px}.gh{position:absolute;inset:0}.tp{position:relative}
.drop{animation:drop .42s cubic-bezier(.2,1.25,.4,1) var(--dl,0ms) backwards}@keyframes drop{from{scale:1.3;rotate:10deg;opacity:0}}
#opp{display:flex;gap:10px;padding:0 10px;overflow-x:auto;justify-content:safe center}
.op{flex:none;display:grid;justify-items:center;gap:6px;padding:8px 14px 8px;border-radius:18px;background:#0006;border:3px solid transparent;transition:border-color .35s,box-shadow .35s,background .35s}
.op.cur{border-color:var(--acc);box-shadow:0 0 20px var(--acc);background:#0009}
.opn{display:flex;align-items:center;gap:6px;font:16px 'Lilita One',sans-serif}.opn .av{margin:0;width:28px;height:28px;font-size:14px}
.cnt{background:var(--y);color:#111;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 7px;font:15px 'Lilita One',sans-serif}
.fan{display:flex;height:52px;padding-left:20px;align-items:center}
.mb{display:block;flex:none;width:32px;height:48px;margin-left:-20px;border-radius:6px;border:2px solid #fff;background:#14141c;position:relative;overflow:hidden;box-shadow:0 2px 6px #000a;transform:rotate(calc((var(--i) - var(--m))*5deg))}
.mb::after{content:'';position:absolute;inset:26% -25%;background:var(--cb);border-radius:50%;transform:rotate(-28deg)}
.mb.in{animation:mbin .45s cubic-bezier(.2,1.4,.4,1) var(--dl,0ms) backwards}@keyframes mbin{from{scale:.3;opacity:0;translate:0 -26px}}
.kk{width:22px;height:22px;padding:0;border-radius:50%;background:var(--r);color:#fff;font-size:12px;line-height:22px;box-shadow:none;margin-left:8px;flex:none}
</style></head><body>
<div id="home"><div style="position:relative;z-index:1"><div class="logo">UNO</div>
<div class="panel"><div class="fx"></div><input id="nm" maxlength="14" placeholder="Your name"><button id="mk" class="r" disabled>Create room</button>
<div style="opacity:.7">or join friends</div><input id="cd" maxlength="4" placeholder="CODE"><button id="jn" class="g" disabled>Join room</button><p id="err"></p></div></div></div>
<div id="room" hidden><div id="bar"></div><div id="opp"></div><div id="tbl"><div id="piles"></div><div id="msg"></div><div id="log"></div><div id="ctl"></div></div><div id="acts"></div><div id="hand"></div></div>
<div id="pick" hidden><div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const C={r:'#ed1c24',y:'#ffde16',g:'#50aa44',b:'#0956bf',k:'#111'},N={r:'Red',y:'Yellow',g:'Green',b:'Blue',k:'Wild'},sym={S:'⊘',R:'⇄',D:'+2',F:'+4',W:''};
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const cl=o=>JSON.parse(JSON.stringify(o)),face=c=>c[1] in sym?sym[c[1]]:c[1],nm=c=>(N[c[0]]+' '+face(c)).trim();
const mkDeck=()=>{const d=[];for(const c of 'rygb'){d.push(c+'0');for(let i=1;i<10;i++)d.push(c+i,c+i);for(const v of 'SRD')d.push(c+v,c+v)}for(let i=0;i<4;i++)d.push('kW','kF');return d};
const shuf=a=>{for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const DB='https://mirogames-default-rtdb.europe-west1.firebasedatabase.app/';let me=ls('uid'),S,code,pend=null,lastN=0;if(!me){me=Math.random().toString(36).slice(2,10);ls('uid',me)}
const err=m=>$('#err').textContent=m||'';
const nx=(s,k=1)=>((s.cur+s.dir*k)%s.players.length+s.players.length)%s.players.length;
const ok=(s,c,h)=>{const t=s.discard[s.discard.length-1];if(c[0]=='k')return c[1]!='F'||!h.some(x=>x[0]==s.color);return c[0]==s.color||c[1]==t[1]};
const take=(s,p,n)=>{while(n--){if(!s.deck.length&&s.discard.length>1){const t=s.discard.pop();s.deck=shuf(s.discard);s.discard=[t]}if(s.deck.length)s.players[p].hand.push(s.deck.pop())}};
const norm=s=>{if(!s)return s;s.deck=s.deck||[];s.discard=s.discard||[];s.players=(s.players||[]).map(p=>({...p,hand:p.hand||[]}));return s};
const url=()=>DB.replace(/\/$/,'')+'/rooms/'+code+'.json',put=s=>fetch(url(),{method:'PUT',body:JSON.stringify(s)}).catch(e=>err('Offline: '+e.message));
const upd=f=>{const s=cl(S);f(s);S=s;render();put(s)};
function start(){upd(s=>{s.deck=shuf(mkDeck());s.players.forEach(p=>{p.hand=s.deck.splice(-7);p.said=false});let i=s.deck.length;while(!/\d/.test(s.deck[--i][1]));s.discard=s.deck.splice(i,1);s.color=s.discard[0][0];s.cur=Math.random()*s.players.length|0;s.dir=1;s.drawn=null;s.uno=null;s.winner=null;s.status='play';s.log='Game on!'})}
function play(i,col){upd(s=>{const p=s.players[s.cur],c=p.hand.splice(i,1)[0],v=c[1];s.discard.push(c);s.color=c[0]=='k'?col:c[0];s.drawn=null;
if(p.hand.length!=1)p.said=false;s.uno=p.hand.length==1&&!p.said?s.cur:null;
let k=1;if(v=='R'){if(s.players.length==2)k=2;else s.dir*=-1}if(v=='S')k=2;if(v=='D'||v=='F'){take(s,nx(s),v=='D'?2:4);k=2}
s.log=p.name+' played '+nm(c)+(c[0]=='k'?' → '+N[col]:'');
if(!p.hand.length){s.status='done';s.winner=s.cur;let t=0;s.players.forEach(q=>q.hand.forEach(x=>t+=/\d/.test(x[1])?+x[1]:x[0]=='k'?50:20));p.score+=t;s.pts=t;s.uno=null}else s.cur=nx(s,k)})}
const draw=()=>upd(s=>{const p=s.players[s.cur];take(s,s.cur,1);s.uno=null;const c=p.hand[p.hand.length-1];if(ok(s,c,p.hand)){s.drawn=p.hand.length-1;s.log=p.name+' drew a playable card'}else{s.log=p.name+' drew a card';s.cur=nx(s)}});
const pass=()=>upd(s=>{s.drawn=null;s.cur=nx(s)});
const uno=()=>upd(s=>{const m=s.players.findIndex(p=>p.id==me);s.players[m].said=true;if(s.uno==m)s.uno=null;s.log=s.players[m].name+' shouts UNO!'});
const catchU=()=>upd(s=>{const q=s.players[s.uno];take(s,s.uno,2);s.log=q.name+' forgot to say UNO! +2 cards';s.uno=null});
const kick=id=>upd(s=>{const i=s.players.findIndex(p=>p.id==id);if(i<0||s.host!=me||id==me)return;const p=s.players.splice(i,1)[0],n=s.players.length;s.kicked=(s.kicked||[]).concat(id);
if(s.status!='lobby'){s.deck=shuf((s.deck||[]).concat(p.hand));
if(n<2||(s.status=='done'&&s.winner==i)){s.status='lobby';s.deck=[];s.discard=[];s.players.forEach(q=>q.hand=[]);s.drawn=null;s.uno=null;s.log=''}
else{if(s.uno==i)s.uno=null;else if(s.uno>i)s.uno--;if(s.winner>i)s.winner--;if(i<s.cur)s.cur--;else if(i==s.cur){s.drawn=null;if(s.dir<0)s.cur--}s.cur=(s.cur+n)%n;s.log=p.name+' was removed by the host'}}});
let AC,mute=ls('mute')=='1',th=ls('theme')||'felt',ph=0,pm=false,pd='',lastLog='',lastMsg='';
const au=()=>{if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC}catch(e){}};
const tone=(f,d=.15,ty='sine',v=.15,t=0,f2)=>{const a=au();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(a.destination);o.start(n);o.stop(n+d+.02)};
const hiss=(d=.12,f=3000,v=.25)=>{const a=au();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=.8;g.gain.value=v;s.connect(fl).connect(g).connect(a.destination);s.start()};
const snd={card(){hiss(.1,2800,.4);tone(150,.09,'triangle',.25,0,60)},draw(){hiss(.14,4200,.22)},turn(){tone(659,.25,'sine',.22);tone(880,.4,'sine',.22,.13)},uno(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.07,i*.07))},bad(){tone(220,.35,'sawtooth',.12,0,80)},no(){tone(120,.12,'square',.08)},win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.12))},tap(){tone(900,.04,'sine',.1)}};
const TH={felt:'#2e9e63',midnight:'#6a4cff',sunset:'#ff7a59',ocean:'#17a2b8',neon:'#ff2bd6'};
const fx=()=>document.querySelectorAll('.fx').forEach(e=>e.innerHTML=Object.keys(TH).map(t=>`<i class="sw ${t==th?'on':''}" data-th=${t} style="background:${TH[t]}"></i>`).join('')+`<b id=snd>${mute?'🔇':'🔊'}</b>`);
const setTh=t=>{th=TH[t]?t:'felt';ls('theme',th);document.body.dataset.t=th;fx()};
const av=p=>{let h=0;for(const c of p.id)h=(h*31+c.charCodeAt(0))%360;return `<span class=av style="background:hsl(${h} 70% 45%)">${esc((p.name[0]||'?').toUpperCase())}</span>`};
const kb=p=>S.host==me&&p.id!=me?`<button class=kk data-kick="${p.id}" title="Remove player">✕</button>`:'';
const ico=c=>{const v=c[1];return v=='S'?'<b class=sk></b>':v=='D'?'<b class=d2><i></i><i></i></b>':v=='F'?'<b class=d4><i style="background:var(--r)"></i><i style="background:var(--y)"></i><i style="background:var(--g)"></i><i style="background:var(--b)"></i></b>':face(c)};
const card=(c,x='',st='',i='',k='')=>{const f=c[1]=='W'?'':face(c);return `<div class="card ${c[0]=='k'?'wild':''} ${x}" data-c="${c}" data-i="${i}" data-k="${k}" style="--c:${C[c[0]]};${st}"><span class=tl>${f}</span><div class=ov><span class=mid>${ico(c)}</span></div><span class=br>${f}</span></div>`};
const back=x=>`<div class="card back ${x||''}"><div class=ov><span class=mid>UNO</span></div></div>`;
const confetti=()=>{for(let i=0;i<70;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*100}vw;background:${Object.values(C)[i%4]};animation-delay:${Math.random()*.8}s;--x:${Math.random()*200-100}px;--rr:${Math.random()*720}deg`;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}};
const set=(sel,key,html)=>{const e=$(sel);if(e._k===key)return false;e._k=key;e.innerHTML=html();return true};
let oc={},pst='',pcid=null;
const fly=(html,f,t,rot=0,dur=420)=>{if(!f||!t)return;const w=document.createElement('div');w.style.cssText='position:fixed;left:0;top:0;z-index:30;pointer-events:none';w.innerHTML=html;const c=w.firstElementChild;c.className=c.className.replace(/\b(ok|no)\b/g,'');c.style.cssText+=';transform:none;transition:none';document.body.appendChild(w);const W=c.offsetWidth,H=c.offsetHeight,p=(r,a)=>`translate(${r.left+r.width/2-W/2}px,${r.top+r.height/2-H/2}px) rotate(${a}deg) scale(${Math.min(r.width/W,r.height/H)})`;w.animate([{transform:p(f,0)},{transform:p(t,rot)}],{duration:dur,easing:'cubic-bezier(.3,.85,.3,1)',fill:'forwards'}).onfinish=()=>w.remove()};
document.addEventListener('pointerdown',()=>au(),{once:true});
document.addEventListener('click',e=>{const q=x=>e.target.closest(x);let t;
if(t=q('[data-th]'))setTh(t.dataset.th);else if(q('#snd')){mute=!mute;ls('mute',mute?'1':'0');fx()}else if(q('#code')){try{navigator.clipboard.writeText(code)}catch(x){}}
else if(S&&(t=q('[data-kick]'))){const p=S.players.find(x=>x.id==t.dataset.kick);if(p&&confirm('Remove '+p.name+' from the room?'))kick(p.id)}else if(S){const m=S.players.findIndex(p=>p.id==me),mine=m==S.cur&&S.status=='play';if(q('#go'))start();else if(q('#dk')){if(mine&&S.drawn==null)draw()}else if(q('#un'))uno();else if(q('#ct'))catchU();else if(q('#ps'))pass()}
if(q('button,[data-th],#snd'))snd.tap()});
function render(){
if(!S)return;const lobby=S.status=='lobby',play=S.status=='play',m=S.players.findIndex(p=>p.id==me),mine=S.cur==m&&play,h=m>=0?S.players[m].hand:[],host=S.host==me,len=S.discard.length,rot=len*37%17-8;
$('#home').hidden=true;$('#room').hidden=false;document.body.classList.add('rm');document.body.style.setProperty('--cc',C[S.color]||'#fff');
set('#bar',S.players.map(p=>p.id+p.name+p.score).join()+S.cur+S.status+S.host,()=>S.players.map((p,i)=>`<div class="pl ${play&&i==S.cur?'cur':''}">${av(p)}<div><b>${esc(p.name)}${p.id==S.host?' 👑':''}</b><br><small>${lobby?'ready':p.score+' pts'}</small></div>${kb(p)}</div>`).join('')+`<div class=fx></div><div id=code title="Tap to copy">${code}</div>`);fx();
const od=lobby?[]:S.players.map((p,i)=>({p,i})).filter(x=>x.p.id!=me),pp=pst=='play';
set('#opp',od.map(x=>x.p.id+x.p.hand.length+x.p.score).join()+S.cur+S.status,()=>od.map(({p,i})=>{const n=p.hand.length,o=pp?(oc[p.id]??n):0,k=Math.min(n,10);return `<div class="op ${play&&i==S.cur?'cur':''}" data-id="${p.id}"><div class=opn>${av(p)}${esc(p.name)}<span class=cnt>${n}</span>${kb(p)}</div><div class=fan>${Array.from({length:k},(_,j)=>`<i class="mb ${j>=o?'in':''}" style="--i:${j};--m:${(k-1)/2};--dl:${(pp?420:0)+(j-o)*(pp?140:70)}ms"></i>`).join('')}</div></div>`}).join(''));
let mt,ctl='',fl=false,top;
if(lobby){set('#piles','lobby',()=>back('big'));mt='Room '+code+' — share the code!';$('#log').textContent=S.players.length+' player(s) · need 2–10';ctl=host?`<button class=g id=go ${S.players.length<2?'disabled':''}>Start game</button>`:'Waiting for the host…'}
else{top=S.discard[len-1];const d=len!=lastN,dk=mine&&S.drawn==null,gh=S.discard[len-2];fl=d&&pp&&len>lastN;if(d)snd.card();lastN=len;
set('#piles',[top,gh,dk,S.dir,len].join(),()=>`<div id=dk class="${dk?'ok':''}">${back('big')}</div><div class=disc style="transform:rotate(${rot}deg)">${gh?`<div class=gh style="transform:rotate(${len*53%23-11}deg)">${card(gh,'big')}</div>`:''}<div class="tp ${d?'drop':''}" style="--dl:${fl?360:0}ms">${card(top,'big')}</div></div><div class="f dir ${S.dir>0?'':'ccw'}">↻</div>`);
if(S.log!=lastLog){lastLog=S.log;$('#log').innerHTML=`<span class=pop>${esc(S.log||'')}</span>`;if(/shouts UNO/.test(S.log))snd.uno();if(/forgot/.test(S.log))snd.bad()}
if(S.status=='done'){mt='🏆 '+S.players[S.winner].name+' wins +'+S.pts+' pts!';ctl=host?'<button class=g id=go>Next round</button>':'Waiting for the host…'}
else mt=mine?(S.drawn!=null?'Play the card you drew, or pass':'Your turn!'):S.players[S.cur].name+"'s turn"}
if(mt!=lastMsg){lastMsg=mt;$('#msg').innerHTML=`<span class=pop>${esc(mt)}</span>`}
set('#ctl',ctl,()=>ctl);
if(mine&&!pm){snd.turn();try{navigator.vibrate&&navigator.vibrate(90)}catch(e){}}pm=mine;document.title=mine?'🔔 Your turn! · UNO':'UNO Rooms';
if(S.status=='done'&&pd!='done'){confetti();snd.win()}pd=S.status;
if(!play)ph=0;else if(h.length>ph)for(let i=0;i<Math.min(h.length-ph,7);i++)setTimeout(snd.draw,i*70);
const oR={},oH={};if(pp)[...$('#hand').children].forEach(e=>{oR[e.dataset.k]=e.getBoundingClientRect();oH[e.dataset.k]=e.outerHTML});
const cn={},ks=h.map(c=>c+'#'+(cn[c]=(cn[c]||0)+1)),gone=Object.keys(oR).filter(k=>!ks.includes(k));
const dkr=$('#dk')?.getBoundingClientRect(),dr=$('#piles .disc')?.getBoundingClientRect();
if(set('#hand',[h.join(),mine,S.drawn,S.color,top,S.status].join('|'),()=>h.map((c,i)=>{const p=mine&&(S.drawn==null||S.drawn==i)&&ok(S,c,h);return card(c,p?'ok':mine?'no':'',`--i:${i};--m:${(h.length-1)/2}`,i,ks[i])}).join(''))){let nw=0;
[...$('#hand').children].forEach(e=>{const o=oR[e.dataset.k],r=e.getBoundingClientRect();
if(o){const dx=o.left-r.left,dy=o.top-r.top;if(dx||dy)e.animate([{translate:`${dx}px ${dy}px`},{translate:'0 0'}],{duration:420,easing:'cubic-bezier(.25,1,.35,1)'})}
else if(dkr&&!lobby)e.animate([{translate:`${dkr.left+dkr.width/2-r.left-r.width/2}px ${dkr.top+dkr.height/2-r.top-r.height/2}px`,scale:'.6',rotate:'-20deg',opacity:.2},{translate:'0 0',scale:'1',rotate:'0deg',opacity:1}],{duration:540,delay:nw++*70,easing:'cubic-bezier(.2,1.15,.4,1)',fill:'backwards'})});
if(fl&&gone.length)fly(oH[gone[0]],oR[gone[0]],dr,rot,400)}
if(fl&&!gone.length&&pcid&&pcid!=me){const b=$('#opp [data-id="'+pcid+'"]');if(b)fly(card(top,'big'),b.getBoundingClientRect(),dr,rot,400)}
if(pp&&dkr)od.forEach(({p})=>{const o=oc[p.id],b=$('#opp [data-id="'+p.id+'"]');if(o!=null&&b&&p.hand.length>o)for(let j=0;j<Math.min(p.hand.length-o,4);j++)setTimeout(()=>fly(back('big'),dkr,b.querySelector('.fan').getBoundingClientRect(),0,420),j*140)});
oc={};od.forEach(({p})=>oc[p.id]=p.hand.length);pst=S.status;pcid=S.players[S.cur]?.id;
ph=play?h.length:0;
const ac=(play&&m>=0&&h.length<=2?'<button class=r id=un>UNO!</button>':'')+(S.uno!=null&&S.uno!=m&&m>=0?'<button class=r id=ct>Catch!</button>':'')+(mine&&S.drawn!=null?'<button id=ps>Pass</button>':'');
set('#acts',ac,()=>ac)}
$('#hand').onclick=e=>{const el=e.target.closest('.card');if(!el)return;if(!el.classList.contains('ok')){if(el.classList.contains('no')){snd.no();el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}return}const i=+el.dataset.i;if(S.players[S.cur].hand[i][0]=='k'){pend=i;$('#pick').hidden=false}else play(i)};
$('#pick div').innerHTML='rygb'.split('').map(c=>`<button data-k=${c} style="background:${C[c]}">${N[c]}</button>`).join('');
$('#pick').onclick=e=>{const k=e.target.dataset.k;$('#pick').hidden=true;if(k&&pend!=null)play(pend,k);pend=null};
async function enter(c,make){const name=$('#nm').value.trim().slice(0,14)||'Player';ls('uname',name);code=c.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4)return err('Enter a 4-letter code');
if(DB.includes('PASTE'))return err('Database URL is not set in the file yet');ls('room',code);let s;
try{s=norm(await(await fetch(url())).json())}catch(e){return err('Cannot reach the database')}
if(!s){if(!make)return err('Room not found');s={host:me,status:'lobby',players:[],deck:[],discard:[],cur:0,dir:1,color:'r',drawn:null,uno:null,winner:null,log:''}}
if((s.kicked||[]).includes(me))return err('You were removed from this room');
const has=x=>x.players.some(p=>p.id==me);
if(!has(s)){if(s.status!='lobby')return err('Game already started');if(s.players.length>=10)return err('Room is full');
for(let t=0;t<5&&!has(s);t++){s.players.push({id:me,name,hand:[],score:0,said:false});await put(s);await new Promise(r=>setTimeout(r,400+Math.random()*600));try{s=norm(await(await fetch(url())).json())||s}catch(e){}}}
const es=new EventSource(url());es.addEventListener('put',e=>{const d=JSON.parse(e.data);if(d.path=='/'&&d.data){S=norm(d.data);if((S.kicked||[]).includes(me)){es.close();ls('kicked','1');ls('room','');location.reload();return}render()}})}
$('#mk').onclick=()=>enter(Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join(''),true);
$('#jn').onclick=()=>enter($('#cd').value,false);
$('#nm').value=ls('uname')||'';$('#cd').value=ls('room')||'';
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='fl';d.style.cssText=`left:${i*11}%;animation-delay:${-i*1.6}s;animation-duration:${12+i%4*3}s`;d.innerHTML=Math.random()<.8?card('rygb'[i%4]+(i%10)):card('kF');$('#home').appendChild(d)}
$('#mk').disabled=$('#jn').disabled=false;setTh(th);if(ls('kicked')){ls('kicked','');err('The host removed you from the room')}
